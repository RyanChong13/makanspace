{% extends "dashboard/base_dashboard.html" %}

{% block dashboard_content %}
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<h1 style="font-size: 1.4rem; margin-bottom: 1rem;">Listings Map</h1>
<p class="text-secondary text-sm mb-2">{{ listings|length }} verified listing{{ listings|length|pluralize }} with location data.</p>

<div id="dashboard-map" style="width: 100%; height: 600px; border-radius: var(--radius-md); background: var(--color-bg-secondary);"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', function () {
        const map = L.map('dashboard-map').setView([1.3521, 103.8198], 11);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors',
            maxZoom: 18,
        }).addTo(map);

        const listings = [
            {% for listing in listings %}
            {
                lat: {{ listing.lat|default:"null" }},
                lng: {{ listing.lng|default:"null" }},
                code: "{{ listing.code }}",
                title: "{{ listing.title|escapejs }}",
                company: "{{ listing.company.name|escapejs }}",
                cost: "{{ listing.cost_display|escapejs }}",
                url: "{% url 'listings:listing_detail' listing.code %}",
            }{% if not forloop.last %},{% endif %}
            {% endfor %}
        ];

        const bounds = [];
        listings.forEach(function (item) {
            if (item.lat === null || item.lng === null) return;
            const marker = L.marker([item.lat, item.lng]).addTo(map);
            marker.bindPopup(
                '<strong><a href="' + item.url + '" target="_blank">' + item.code + '</a></strong><br>' +
                item.title + '<br>' +
                '<span class="text-secondary">' + item.company + ' &middot; ' + item.cost + '</span>'
            );
            bounds.push([item.lat, item.lng]);
        });

        if (bounds.length > 0) {
            map.fitBounds(bounds, { padding: [40, 40], maxZoom: 14 });
        }
    });
</script>
{% endblock %}
