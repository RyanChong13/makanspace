{% extends "account/base.html" %}
{% load static i18n %}

{% block title %}{% trans "Sign Out" %} — MakanSpace{% endblock %}

{% block auth_content %}
<div style="text-align: center; margin-bottom: 1.5rem;">
    <img src="{% static 'img/logo.svg' %}" alt="MakanSpace" style="width: 60px; height: 60px; border-radius: 50%; margin-bottom: 0.5rem; color: var(--color-accent);">
    <h1 style="font-size: 1.4rem; font-weight: 700; color: var(--color-header);">{% trans "Sign Out" %}</h1>
    <p class="text-secondary">{% trans "Are you sure you want to sign out?" %}</p>
</div>

<div class="card">
    <div class="card__body">
        <form method="post" action="{% url 'account_logout' %}">
            {% csrf_token %}
            <button type="submit" class="btn btn--primary btn--full" style="padding: 0.75rem;">
                {% trans "Sign Out" %}
            </button>
        </form>
        <div style="text-align: center; margin-top: 1rem;">
            <a href="{% url 'listings:listing_list' %}" class="text-sm text-secondary">{% trans "Cancel" %}</a>
        </div>
    </div>
</div>
{% endblock %}
